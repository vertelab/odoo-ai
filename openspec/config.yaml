schema: spec-driven

context: |
  Tech stack: Python 3.12, Odoo 18, LangGraph (existing), FAISS, pgvector, Bifrost LLM Gateway
  Project: ai_agent_core — refakturerad AI-agentmotor för Odoo. Ersätter monolitiska ai_agent
  med modulär arkitektur inspirerad av Buzz-agent (Block/Square) och Taskless.
  
  Konventioner:
  - PEP8, 4-space indent, snake_case
  - Odoo-moduler i /usr/share/odoo-ai/
  - Hemligheter i Salt pillar, aldrig i kod
  - Bifrost LLM Gateway: 192.168.11.150:8080/v1 (OpenAI-kompatibel)
  - Använd httpx för HTTP, Pydantic v2 för validering
  - Inga nya LangChain/LangGraph-beroenden för core-loopen

rules:
  proposal:
    - Keep proposals focused on one capability
    - Always include a "Non-goals" section
  design:
    - Include architecture diagrams (ASCII)
    - Document trade-offs explicitly
  tasks:
    - Break into implementable chunks
    - Mark dependencies between tasks
  specs:
    - Use requirement language: MUST, SHOULD, MAY
    - Each requirement should be testable
